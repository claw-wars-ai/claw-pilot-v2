<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Env Drift Checker</title>
  <meta name="description" content="Compare .env and .env.example in your browser with no login and no upload.">
  <style>
    :root { --ink:#162016; --muted:#586358; --paper:#f4f1e8; --card:#fffaf0; --line:#d8cfbd; --green:#d8f3dc; --red:#ffd6d6; --amber:#ffe8ad; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif; background:radial-gradient(circle at top left,#d6eadf 0,transparent 34%),linear-gradient(135deg,#f4f1e8,#e7edf3); color:var(--ink); }
    main { max-width:1120px; margin:0 auto; padding:40px 18px 56px; }
    .hero { border:1px solid var(--line); background:rgba(255,250,240,.92); padding:26px; box-shadow:8px 8px 0 #162016; }
    h1 { margin:0 0 10px; font-size:clamp(2.1rem,5vw,4.4rem); line-height:.94; letter-spacing:-.04em; }
    p { color:var(--muted); font-size:1.05rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:24px 0; }
    label { display:block; font-weight:700; margin:0 0 8px; }
    textarea { width:100%; min-height:260px; resize:vertical; border:1px solid var(--line); background:var(--card); padding:14px; font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; color:var(--ink); }
    button { border:0; background:var(--ink); color:white; padding:13px 18px; font-weight:800; cursor:pointer; }
    .summary { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; }
    .pill { background:var(--card); border:1px solid var(--line); padding:9px 12px; font-weight:700; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
    th,td { text-align:left; border-bottom:1px solid var(--line); padding:9px; vertical-align:top; font:14px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace; }
    th { font-family:inherit; background:#efe7d7; }
    tr.same { background:var(--green); } tr.changed { background:var(--red); } tr.missing,tr.extra { background:var(--amber); }
    footer { margin-top:28px; color:var(--muted); font-size:.9rem; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } .hero { box-shadow:4px 4px 0 #162016; } }
  </style>
</head>
<body>
  <!-- claw-wars-current-run:harness-public_launch_pilot-20260420t103120z:hb3:2026-04-20T10:35:46Z -->
  <main>
    <section class="hero">
      <h1>No-login .env drift checker</h1>
      <p>Paste your real <code>.env</code> and your template <code>.env.example</code>. Everything runs locally in the browser; nothing is uploaded.</p>
    </section>
    <section class="grid" aria-label="Inputs">
      <div><label for="actual">.env</label><textarea id="actual">DATABASE_URL=postgres://local
API_KEY=dev-123
FEATURE_FLAG=true
OLD_SECRET=keep-local</textarea></div>
      <div><label for="example">.env.example</label><textarea id="example">DATABASE_URL=
API_KEY=
FEATURE_FLAG=false
STRIPE_WEBHOOK_SECRET=</textarea></div>
    </section>
    <button id="diff">Diff files</button>
    <div class="summary" id="summary"></div>
    <table aria-label="Diff results"><thead><tr><th>Key</th><th>Status</th><th>.env</th><th>.env.example</th></tr></thead><tbody id="results"></tbody></table>
    <footer>Current run marker: claw-wars-current-run:harness-public_launch_pilot-20260420t103120z:hb3:2026-04-20T10:35:46Z</footer>
  </main>
  <script>
    function esc(value) { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function parseEnv(text) {
      const out = new Map();
      text.split(/?
/).forEach((line) => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) return;
        const idx = trimmed.indexOf('=');
        if (idx === -1) return;
        out.set(trimmed.slice(0, idx).trim(), trimmed.slice(idx + 1).trim());
      });
      return out;
    }
    function render() {
      const actual = parseEnv(document.getElementById('actual').value);
      const example = parseEnv(document.getElementById('example').value);
      const keys = Array.from(new Set([...actual.keys(), ...example.keys()])).sort();
      const counts = { same:0, changed:0, missing:0, extra:0 };
      const rows = keys.map((key) => {
        const hasActual = actual.has(key), hasExample = example.has(key);
        let status = 'same';
        if (!hasActual) status = 'missing'; else if (!hasExample) status = 'extra'; else if (actual.get(key) !== example.get(key)) status = 'changed';
        counts[status] += 1;
        return `<tr class="${status}"><td>${esc(key)}</td><td>${status}</td><td>${esc(actual.get(key) ?? '')}</td><td>${esc(example.get(key) ?? '')}</td></tr>`;
      }).join('');
      document.getElementById('results').innerHTML = rows || '<tr><td colspan="4">No variables found.</td></tr>';
      document.getElementById('summary').innerHTML = Object.entries(counts).map(([k,v]) => `<span class="pill">${v} ${k}</span>`).join('');
      window.__clawCoreActionCount = (window.__clawCoreActionCount || 0) + 1;
    }
    document.getElementById('diff').addEventListener('click', render);
    render();
  </script>
</body>
</html>
